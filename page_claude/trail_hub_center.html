<title>Trail Hub Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : bandeau du haut + barre des rubriques (à gauche sur ordinateur, en ruban sur téléphone)
   + contenu en cartes, comme le logiciel de bureau. Sombre par défaut, clair au choix. */
:root {
  --fond: #12151A;
  --fond-2: #14181D;
  --carte: #1B2126;
  --carte-haute: #212930;
  --bordure: #262E34;
  --texte: #F3F6F7;
  --texte-2: #9AA7AE;
  --texte-3: #6B767D;
  --accent: #2E7D32;
  --accent-texte: #66BB6A;
  --accent-doux: rgba(102, 187, 106, .14);
  --bleu: #4C8DFF;
  --orange: #DD6B26;
  --vert: #43A047;
  --jaune: #F2C230;
  --rouge: #E5534B;
  --grille: rgba(154, 167, 174, .14);
  --ombre: 0 1px 0 rgba(0,0,0,.25);
  --z1: #1E3A22; --z2: #2C6B33; --z3: #3E9447; --z4: #63B86A; --z5: #A6DCA9;
  --police-titre: "Sora", "Segoe UI", system-ui, sans-serif;
  --police-texte: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --police-chiffres: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --fond: #F4F6F7; --fond-2: #ECEFF1; --carte: #FFFFFF; --carte-haute: #F3F5F6; --bordure: #D7DCE0;
    --texte: #161A1E; --texte-2: #5B656C; --texte-3: #7F8990;
    --accent: #2E7D32; --accent-texte: #2E7D32; --accent-doux: rgba(46, 125, 50, .10);
    --bleu: #1976D2; --orange: #E65100; --vert: #2E7D32; --jaune: #B7860B; --rouge: #C62828;
    --grille: rgba(91, 101, 108, .16); --ombre: 0 1px 2px rgba(22,26,30,.06);
    --z1: #DDEFDD; --z2: #A9D7AB; --z3: #6DBB72; --z4: #3E9447; --z5: #1F5E25;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --fond: #F4F6F7; --fond-2: #ECEFF1; --carte: #FFFFFF; --carte-haute: #F3F5F6; --bordure: #D7DCE0;
  --texte: #161A1E; --texte-2: #5B656C; --texte-3: #7F8990;
  --accent: #2E7D32; --accent-texte: #2E7D32; --accent-doux: rgba(46, 125, 50, .10);
  --bleu: #1976D2; --orange: #E65100; --vert: #2E7D32; --jaune: #B7860B; --rouge: #C62828;
  --grille: rgba(91, 101, 108, .16); --ombre: 0 1px 2px rgba(22,26,30,.06);
  --z1: #DDEFDD; --z2: #A9D7AB; --z3: #6DBB72; --z4: #3E9447; --z5: #1F5E25;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--fond); color: var(--texte); }
body { font-family: var(--police-texte); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fond-2); }
h1, h2, h3 { font-family: var(--police-titre); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-texte); outline-offset: 2px; border-radius: 6px; }
.chiffre { font-family: var(--police-chiffres); font-variant-numeric: tabular-nums; }
.discret { color: var(--texte-2); }
.tres-discret { color: var(--texte-3); }
.petit { font-size: .82rem; }

/* Bandeau */
.bandeau { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fond-2); border-bottom: 1px solid var(--bordure); }
.bandeau-int { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marque { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.marque svg { flex: none; }
.marque-nom { font-family: var(--police-titre); font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; white-space: nowrap; }
.marque-mode { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-texte); background: var(--accent-doux); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.commandes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bouton { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--bordure); background: var(--carte); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .9rem; white-space: nowrap; }
.bouton:hover { border-color: var(--texte-3); }
.bouton.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
.bouton.principal:hover { filter: brightness(1.08); }
.bouton[disabled] { opacity: .55; cursor: default; }
select.choix { border: 1px solid var(--bordure); background: var(--carte); padding: 7px 10px; border-radius: 8px; max-width: 220px; }
.bouton-icone { padding: 7px 9px; }

/* Bandeau d'état de la source */
.source { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; font-size: .86rem; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; border-bottom: 1px solid var(--bordure); background: var(--fond); }
.source .pastille { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--jaune); margin-right: 6px; vertical-align: 1px; }
.source.reelle .pastille { background: var(--vert); }
.source b { font-weight: 600; }

/* Ossature */
.ossature { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100vh - 110px); }
nav.rubriques { border-right: 1px solid var(--bordure); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); align-self: start; }
nav.rubriques a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--texte-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav.rubriques a:hover { background: var(--carte); color: var(--texte); }
nav.rubriques a[aria-current="page"] { background: var(--accent-doux); color: var(--accent-texte); }
nav.rubriques svg { flex: none; opacity: .9; }
nav.rubriques .lib-court { display: none; }
main { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.vue { display: flex; flex-direction: column; gap: 18px; max-width: 1180px; }
.entete-vue { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.entete-vue p { color: var(--texte-2); max-width: 70ch; }

@media (max-width: 820px) {
  .ossature { grid-template-columns: minmax(0, 1fr); }
  nav.rubriques { position: static; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--bordure); padding: 8px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
  nav.rubriques a { padding: 7px 11px; }
  nav.rubriques a .lib-long { display: none; }
  nav.rubriques a .lib-court { display: inline; }
  .marque-mode { display: none; }
}

/* Cartes */
.grille { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
@media (max-width: 420px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.carte { background: var(--carte); border: 1px solid var(--bordure); border-radius: 12px; padding: 16px; box-shadow: var(--ombre); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.carte > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.etiquette { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--texte-2); font-weight: 600; }
.mesure { display: flex; flex-direction: column; gap: 4px; }
.mesure .valeur { font-family: var(--police-titre); font-weight: 700; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.mesure .valeur small { font-size: .95rem; font-weight: 600; color: var(--texte-2); margin-left: 3px; }
.mesure .detail { font-size: .85rem; color: var(--texte-2); }
.etat { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.etat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.etat.vert { color: var(--vert); } .etat.orange { color: var(--orange); } .etat.rouge { color: var(--rouge); } .etat.jaune { color: var(--jaune); } .etat.neutre { color: var(--texte-2); }
.vide { color: var(--texte-3); font-size: .9rem; padding: 6px 0; }

/* Nutrition de course */
.ns { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; font-weight: 800; font-family: var(--police-titre); color: #fff; font-size: .95rem; flex: none; }
.ns.grand { width: 44px; height: 44px; border-radius: 10px; font-size: 1.5rem; }
.ns-A { background: #038141; } .ns-B { background: #85BB2F; color: #111; } .ns-C { background: #FECB02; color: #111; } .ns-D { background: #EE8100; } .ns-E { background: #E63E11; } .ns-x { background: var(--texte-3); }
tr.choisi-cmp td { background: var(--accent-doux); }
tr[data-produit] { cursor: pointer; }
.recette-lignes { display: grid; gap: 6px; }
.liste-puces { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .9rem; }
.recette-ligne { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 6px; }
.recette-ligne select, .recette-ligne input, .recette-tete select, .recette-tete input { border: 1px solid var(--bordure); background: var(--carte); color: var(--texte); padding: 7px 9px; border-radius: 8px; min-width: 0; font: inherit; }
.recette-tete { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 110px; gap: 6px; }
@media (max-width: 520px) { .recette-tete { grid-template-columns: minmax(0, 1fr); } }
.verdict-valide { color: var(--vert); } .verdict-a_confirmer { color: var(--bleu); } .verdict-prudence { color: var(--orange); } .verdict-eviter { color: var(--rouge); } .verdict-jamais { color: var(--texte-3); }

/* Listes */
.liste { display: flex; flex-direction: column; }
.liste > * + * { border-top: 1px solid var(--bordure); }
.ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; align-items: center; }
.ligne > span:first-child { min-width: 0; }
.ligne .titre { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne .sous { display: block; font-size: .84rem; color: var(--texte-2); }
.ligne .droite .sous { display: inline; }
.ligne .droite { text-align: right; font-size: .9rem; }
button.ligne { background: none; border: 0; width: 100%; text-align: left; cursor: pointer; padding-inline: 6px; border-radius: 6px; }
button.ligne:hover { background: var(--carte-haute); }

/* Tableaux */
.tableau-cadre { overflow-x: auto; margin-inline: -4px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--texte-2); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--bordure); white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--bordure); white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--police-chiffres); font-variant-numeric: tabular-nums; }
td.nom { white-space: normal; min-width: 160px; }
td.long { white-space: normal; min-width: 220px; }
tbody tr.cliquable { cursor: pointer; }
tbody tr.cliquable:hover td { background: var(--carte-haute); }
tbody tr.choisie td { background: var(--accent-doux); }

/* Filtres */
.filtres { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filtres input[type=search] { border: 1px solid var(--bordure); background: var(--carte); padding: 7px 11px; border-radius: 8px; min-width: 0; flex: 1 1 200px; max-width: 320px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { border: 1px solid var(--bordure); background: var(--carte); border-radius: 99px; padding: 4px 11px; font-size: .84rem; cursor: pointer; }
.puce[aria-pressed="true"] { background: var(--accent-doux); border-color: var(--accent-texte); color: var(--accent-texte); }

/* Graphiques */
.graphe { position: relative; width: 100%; }
.graphe svg { display: block; width: 100%; height: auto; overflow: visible; }
.graphe text { fill: var(--texte-2); font-family: var(--police-chiffres); font-size: 10.5px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--texte-2); }
.legende i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.bulle { position: absolute; pointer-events: none; background: var(--carte-haute); border: 1px solid var(--bordure); border-radius: 8px; padding: 6px 9px; font-size: .8rem; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: nowrap; z-index: 3; color: var(--texte); }
.bulle b { font-family: var(--police-chiffres); font-weight: 500; }

/* Calendrier annuel */
.calendrier { overflow-x: auto; padding-bottom: 4px; }
.calendrier svg { display: block; }
.calendrier rect { rx: 2px; }

/* Détail d'une sortie */
.detail-sortie { border-color: var(--accent); }
.trace-et-profil { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .trace-et-profil { grid-template-columns: minmax(0, 1fr); } }
.trace { background: var(--fond-2); border-radius: 10px; border: 1px solid var(--bordure); aspect-ratio: 1 / 1; max-width: 100%; position: relative; overflow: hidden; }
.trace svg { width: 100%; height: 100%; display: block; }
.mesures-ligne { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.mesures-ligne .mesure .valeur { font-size: 1.25rem; }
.zones { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.zones span { display: block; height: 100%; }

/* Barres de progression (matériel) */
.jauge { height: 8px; border-radius: 4px; background: var(--fond-2); border: 1px solid var(--bordure); overflow: hidden; }
.jauge span { display: block; height: 100%; border-radius: 4px; }

/* Coach */
.coach-fil { display: flex; flex-direction: column; gap: 12px; }
.message { padding: 12px 14px; border-radius: 12px; max-width: 72ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.message.moi { align-self: flex-end; background: var(--accent-doux); border: 1px solid var(--accent); }
.message.claude { align-self: flex-start; background: var(--carte-haute); border: 1px solid var(--bordure); }
.message.claude .qui { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--texte-2); font-weight: 600; display: block; margin-bottom: 4px; }
.saisie { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.saisie textarea { flex: 1 1 260px; min-height: 64px; resize: vertical; border: 1px solid var(--bordure); background: var(--fond-2); border-radius: 10px; padding: 10px 12px; }
details.envoye summary { cursor: pointer; color: var(--texte-2); font-size: .86rem; }
details.envoye pre { white-space: pre-wrap; font-family: var(--police-chiffres); font-size: .78rem; color: var(--texte-2); background: var(--fond-2); border: 1px solid var(--bordure); border-radius: 8px; padding: 10px; max-height: 280px; overflow: auto; margin: 8px 0 0; }

/* Accueil sans base */
.ouvrir { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
@media (max-width: 760px) { .ouvrir { grid-template-columns: minmax(0, 1fr); } }
.depot { border: 1.5px dashed var(--texte-3); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.depot.survol { border-color: var(--accent-texte); background: var(--accent-doux); }
ol.etapes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--texte-2); }
ol.etapes b { color: var(--texte); font-weight: 600; }
.message-erreur { color: var(--rouge); font-weight: 500; }
.chargement { display: inline-flex; gap: 8px; align-items: center; color: var(--texte-2); }
.rond { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bordure); border-top-color: var(--accent-texte); animation: tourne 0.8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rond { animation: none; } }
.pied { color: var(--texte-3); font-size: .8rem; margin-top: 10px; }

/* Fil d'activité et analyses automatiques */
.fil { display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
.mois-fil { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--texte-3); font-weight: 700; margin-top: 6px; }
.carte-fil { background: var(--carte); border: 1px solid var(--bordure); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fil-tete { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.fil-tete h3 { font-size: 1.08rem; }
.fil-tete button { all: unset; cursor: pointer; }
.fil-tete button:hover h3 { color: var(--accent-texte); }
.fil-tete button:focus-visible { outline: 2px solid var(--accent-texte); outline-offset: 3px; border-radius: 6px; }
.fil-chiffres { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; }
.fil-chiffres .etiquette { font-size: .66rem; }
.fil-chiffres b { display: block; font-family: var(--police-titre); font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.fil-trace { width: 150px; height: 104px; border-radius: 10px; background: var(--fond-2); border: 1px solid var(--bordure); overflow: hidden; }
.fil-trace svg { width: 100%; height: 100%; display: block; }
@media (max-width: 520px) { .fil-trace { width: 100px; height: 80px; } }
.analyse { background: var(--fond-2); border: 1px solid var(--bordure); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.analyse > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge-analyse { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--texte-2); }
.badge-analyse.ia { color: var(--accent-texte); }
.badge-analyse.claude { color: var(--bleu); }
.lien { all: unset; cursor: pointer; color: var(--accent-texte); font-size: .84rem; }
.lien:focus-visible { outline: 2px solid var(--accent-texte); outline-offset: 2px; }
.md { font-size: .92rem; line-height: 1.55; overflow-wrap: anywhere; }
.md h4 { font-family: var(--police-titre); font-size: .9rem; margin: 8px 0 2px; }
.md h4:first-child { margin-top: 0; }
.md ul { margin: 2px 0; padding-left: 1.2em; }
.md p { margin: 2px 0; }
.md em { color: var(--texte-2); }
.md.replie { max-height: 7.8em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.lecture { border-color: var(--bleu); }
.lecture .md { color: var(--texte); }
.attente { display: inline-flex; gap: 8px; align-items: center; color: var(--texte-2); font-size: .9rem; }
</style>

<header class="bandeau">
  <div class="bandeau-int">
    <div class="marque">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect width="30" height="30" rx="8" fill="var(--accent)"/>
        <path d="M4 22 L11 11 L15 16 L19 8 L26 22 Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="19" cy="8" r="1.8" fill="#fff"/>
      </svg>
      <span class="marque-nom">Trail Hub Center</span>
      <span class="marque-mode">Consultation</span>
    </div>
    <div class="commandes">
      <label class="tres-discret petit" for="choix-athlete" id="lib-athlete" hidden>Coureur</label>

    Base.ouvrir(octets);
    if (!Base.tablesPresentes.has("athletes") || !Base.tablesPresentes.has("activites")) throw new Error("Cette base ne contient pas les tables de TrailMaster (athlètes, activités).");
    const aths = Base.tous("SELECT a.id, a.prenom, a.nom, (SELECT COUNT(*) FROM activites s WHERE s.athlete_id = a.id) AS nb FROM athletes a ORDER BY a.id");

    const memo = Number(lireStockage("thc-athlete"));
    const parDefaut = aths.find((a) => a.id === memo) || aths.slice().sort((x, y) => y.nb - x.nb)[0];

   Les analyses déjà écrites par le logiciel (IA ou hors ligne) sont
   lues dans la base. Ce qui manque est écrit ici, sans bouton :
   par Claude quand la page est ouverte dans Claude avec ta base,
   sinon par les règles de la page (hors ligne).

function md(texte) {
  const enLigne = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_(.+?)_(?=[\s.,;:)]|$)/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const sortie = []; let liste = false;
  for (const brute of String(texte || "").split("\n")) {
    const l = brute.trimEnd();
    const puce = l.match(/^\s*[-*•]\s+(.*)$/);
    if (!puce && liste) { sortie.push("</ul>"); liste = false; }
    if (!l.trim()) continue;
    const titre = l.match(/^#{1,6}\s+(.*)$/);
    if (titre) sortie.push(`<h4>${enLigne(titre[1])}</h4>`);
    else if (puce) { if (!liste) { sortie.push("<ul>"); liste = true; } sortie.push(`<li>${enLigne(puce[1])}</li>`); }
    else sortie.push(`<p>${enLigne(l)}</p>`);
  }
  if (liste) sortie.push("</ul>");
  return sortie.join("");
}

const reponsesClaude = new Map();

function demanderClaude(cle, prompt, surTexte) {
  const memo = reponsesClaude.get(cle);
  if (memo && memo.etat !== "erreur") { if (memo.etat === "fait") surTexte(memo); return; }
  const entree = { etat: "attente", texte: "", abonnes: [surTexte] };
  reponsesClaude.set(cle, entree);
  fileClaude = fileClaude.then(async () => {
    if (!echantillon) { entree.etat = "erreur"; entree.code = "absent"; entree.abonnes.forEach((f) => f(entree)); return; }
    entree.etat = "en_cours";
    try {
      const { text } = await echantillon(prompt, { cache: { gcTime: 86400000 }, onText: ({ text }) => { entree.texte = text; entree.abonnes.forEach((f) => f(entree)); } });
      entree.texte = text; entree.etat = "fait";
    } catch (e) {
      entree.etat = "erreur"; entree.code = e?.code || "upstream_error"; entree.texte = e?.text || "";
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") echantillon = null;
    }
    entree.abonnes.forEach((f) => f(entree));
  });
}

/* thème : celui de l'appareil par défaut, ou le choix mémorisé */
function appliquerTheme(t) { if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); }
appliquerTheme(lireStockage("thc-theme"));
$("#bouton-theme").onclick = () => {
  const actuel = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const t = actuel === "dark" ? "light" : "dark"; appliquerTheme(t); ecrireStockage("thc-theme", t); rendreTout();
};
$("#bouton-ouvrir").onclick = () => $("#fichier").click();
$("#fichier").onchange = (e) => { ouvrirFichier(e.target.files[0]); e.target.value = ""; };
$("#choix-athlete").onchange = (e) => { choisirAthlete(+e.target.value); rendreTout(); };
window.addEventListener("hashchange", () => { rendreTout(); window.scrollTo(0, 0); });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer?.files?.[0]) ouvrirFichier(e.dataTransfer.files[0]); });
let largeurPrec = window.innerWidth;
window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - largeurPrec) > 40) { largeurPrec = window.innerWidth; const r = rubriqueCourante(); if (r === "forme") dessinerForme(); if (r === "sante") dessinerSante(); if (r === "sorties") rendreDetailSortie(); } });

utiliserExemple();
rendreTout();

})();
