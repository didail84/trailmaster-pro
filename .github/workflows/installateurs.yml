# Fabrique les installateurs Windows, Mac et Linux de TrailMaster Pro et les ajoute
# à la version (release) publiée sur GitHub.
#  - automatiquement quand une release est publiée (étiquette V99, V100…) ;
#  - ou à la main : Actions › Installateurs › Run workflow (en indiquant
#    éventuellement l'étiquette d'une release existante à compléter).
name: Installateurs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette d'une release existante à compléter (ex. V99). Vide = simple essai."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: windows-x64
            os: windows-latest
            contraintes: ''
          - nom: mac-intel
            os: macos-15-intel
            contraintes: '-c packaging/contraintes-mac-intel.txt'
          - nom: mac-apple-silicon
            os: macos-14
            contraintes: ''
          - nom: linux-x64
            os: ubuntu-22.04
            contraintes: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow ${{ matrix.contraintes }}

      - name: Bibliothèques Qt et appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libnss3 libasound2 \
            libfontconfig1 libdbus-1-3 file
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Vérification de la syntaxe
        shell: bash
        run: python -m compileall -q noyau interface data main.py

      - name: Tests automatiques
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          pip install pytest
          python -m pytest -q -p no:cacheprovider tests

      - name: Fabrication
        shell: bash
        env:
          BUILD_ID: ${{ github.run_number }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python packaging/construire.py 2>&1 | tee fabrication.log || {
            # en cas d'échec : les dernières lignes deviennent des annotations lisibles sur GitHub
            tail -n 25 fabrication.log | while IFS= read -r ligne; do echo "::error::$ligne"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.nom }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*-portable.zip
            dist/*.AppImage
            dist/*.deb
            dist/*-linux-*.tar.gz
          if-no-files-found: error

  publier:
    needs: construire
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Manifeste Relais (empreintes, signature si le secret RELAIS_CLE_PRIVEE existe)
        env:
          RELAIS_CLE_PRIVEE: ${{ secrets.RELAIS_CLE_PRIVEE }}
          RELAIS_NOTES: ${{ github.event.release.body }}
        run: |
          pip install -q cryptography
          python code/packaging/relais_manifeste.py installateurs "${{ github.event.release.tag_name || inputs.tag }}" \
            ${{ github.event.release.prerelease && '--canal test' || '' }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: installateurs/*
