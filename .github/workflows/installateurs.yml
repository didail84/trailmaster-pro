# Fabrique les installateurs Windows et Mac de TrailMaster Pro et les ajoute
# à la version (release) publiée sur GitHub.
#  - automatiquement quand une release est publiée (étiquette V99, V100…) ;
#  - ou à la main : Actions › Installateurs › Run workflow (en indiquant
#    éventuellement l'étiquette d'une release existante à compléter).
name: Installateurs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette d'une release existante à compléter (ex. V99). Vide = simple essai."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: windows-x64
            os: windows-latest
            contraintes: ''
          - nom: mac-intel
            os: macos-15-intel
            contraintes: '-c packaging/contraintes-mac-intel.txt'
          - nom: mac-apple-silicon
            os: macos-14
            contraintes: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow ${{ matrix.contraintes }}

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Vérification de la syntaxe
        shell: bash
        run: python -m compileall -q interface data main.py

      - name: Fabrication
        shell: bash
        env:
          BUILD_ID: ${{ github.run_number }}
        run: python packaging/construire.py

      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.nom }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  publier:
    needs: construire
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: installateurs/*
